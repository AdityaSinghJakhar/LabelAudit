services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labelaudit
      POSTGRES_PASSWORD: labelaudit
      POSTGRES_DB: labelaudit
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelaudit"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://labelaudit:labelaudit@db:5432/labelaudit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
