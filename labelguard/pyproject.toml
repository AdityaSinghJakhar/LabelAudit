[project]
name = "labelguard"
version = "0.1.0"
description = "Legal Metrology label compliance domain logic: field extraction, rules engine, measurement."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["labelguard*"]

[tool.setuptools.package-data]
labelguard = ["rules/ruleset.yaml"]
