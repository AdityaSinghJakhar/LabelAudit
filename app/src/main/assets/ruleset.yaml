# =============================================================================
# LabelGuard AI — compliance ruleset
#
# COPY. The reviewed original lives in the LabelGuard Python repo at
# labelguard/rules/ruleset.yaml. This file is the on-device copy loaded from
# assets; keep the two in step when either changes. RulesetParityTest asserts
# the rule ids and citations here match what the engine expects.
#
# Scope: ONE flat-packaged SKU. Cylindrical products are out of scope; the
# planarity gate in capture/gate.py rejects them before any rule runs.
#
# CITATION STATUS
#   Clause references below are transcribed from the Legal Metrology
#   (Packaged Commodities) Rules, 2011. They are reproduced here so that every
#   finding can be traced to a statutory source, but they have NOT been
#   verified against the current amended text by a legal reviewer. Treat the
#   `citation` strings as provisional until that review happens.
#
#   Where a rule depends on a numeric threshold drawn from a statutory table
#   (notably LG-CAP-01, which reads Rule 9's size table), the threshold is
#   carried in `params` and marked `needs_legal_confirmation: true`. Those
#   rules emit NEEDS_REVIEW rather than FAIL until the value is confirmed —
#   the engine must never assert a violation it cannot substantiate.
# =============================================================================

version: "2026.1.0"

source_citation: >-
  Legal Metrology (Packaged Commodities) Rules, 2011 (as amended),
  Chapter II — Provisions applicable to packages intended for retail sale.

# Which vertical text measurement the engine compares against statutory
# minimums. cap_height = height of a capital letter, excluding ascenders and
# descenders. See measure/cap_height.py.
height_metric: cap_height

# -----------------------------------------------------------------------------
# Exemptions — evaluated BEFORE rules.
#
# When an exemption's condition holds, every rule id in `exempts` is skipped and
# reported as EXEMPT carrying the exemption's citation. An exempted rule never
# contributes a violation.
# -----------------------------------------------------------------------------
exemptions:
  - id: EX-SMALL-PACK
    condition:
      field: net_quantity
      op: lte
      value: 10
      unit: g
    exempts:
      - LG-CARE-01
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 26 — exemption for
      packages containing a commodity of net weight or measure of 10 g or 10 ml
      or less.

  - id: EX-SMALL-PACK-ML
    condition:
      field: net_quantity
      op: lte
      value: 10
      unit: ml
    exempts:
      - LG-CARE-01
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 26 — exemption for
      packages containing a commodity of net weight or measure of 10 g or 10 ml
      or less.

# -----------------------------------------------------------------------------
# Rules
#
# check.type values are implemented in rules/engine.py:
#   field_present     — field extracted and non-empty
#   matches_registry  — extracted value equals the registry value for this SKU
#   role_present      — an address carrying the named role was found
#   min_height_mm     — measured cap height >= params.min_mm
# -----------------------------------------------------------------------------
rules:
  - id: LG-MRP-01
    name: "Price is declared"
    field: mrp
    check:
      type: field_present
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(e) — retail
      sale price of the package.

  - id: LG-MRP-02
    name: "Price matches the registered value"
    field: mrp
    check:
      type: matches_registry
      registry_key: mrp_exact
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(e) — the
      declared retail sale price must be the maximum retail price for the
      package as registered.

  - id: LG-QTY-01
    name: "Net quantity is declared"
    field: net_quantity
    check:
      type: field_present
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(c) — net
      quantity in terms of standard unit of weight or measure.

  - id: LG-QTY-02
    name: "Net quantity matches the registered pack size"
    field: net_quantity
    check:
      type: matches_registry
      registry_key: net_quantity
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(c) — declared
      net quantity must correspond to the registered pack size.

  - id: LG-BRAND-01
    name: "Brand matches the registered name"
    field: brand
    check:
      type: matches_registry
      registry_key: brand_strings
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(b) — common
      or generic name of the commodity contained in the package.

  - id: LG-MFR-01
    name: "Manufacturer address is declared"
    # Must name a field the extractor actually produces, otherwise the finding
    # carries no observed value, no agreement and no evidence crop.
    field: manufacturer_address
    check:
      type: role_present
      role: manufacturer
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(a) — name and
      complete address of the manufacturer, or of the packer or importer where
      the manufacturer is not the packer.

  - id: LG-CARE-01
    name: "Consumer care details are declared"
    field: consumer_care
    check:
      type: field_present
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(f) — name,
      address, telephone number and email address of the person who can be
      contacted in case of consumer complaints.

  - id: LG-MRP-03
    name: "Price is stated as inclusive of all taxes"
    field: tax_inclusive
    check:
      type: field_present
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 2(m) read with
      r. 6(1)(e) — the retail sale price must be declared as the maximum price
      inclusive of all taxes.

  - id: LG-DATE-01
    name: "Manufacturing or packing date is declared"
    field: mfg_date
    check:
      type: field_present
    citation: >-
      Legal Metrology (Packaged Commodities) Rules, 2011, r. 6(1)(d) — the
      month and year in which the commodity is manufactured, pre-packed or
      imported.

  - id: LG-BATCH-01
    name: "Batch or lot number is declared"
    field: batch_number
    check:
      type: field_present
    citation: >-
      Food Safety and Standards (Labelling and Display) Regulations, 2020,
      reg. 5 — lot, code or batch identification of the pre-packaged food.

  - id: LG-EXPIRY-01
    name: "Date marking a consumer can resolve"
    field: expiry
    check:
      # A period such as "best before 2 months from the date of packing" only
      # yields a date if the date it counts from is declared. Without that,
      # the consumer can determine no date and the marking fails on its own
      # terms.
      type: date_marking
      relative_requires: mfg_date
    citation: >-
      Food Safety and Standards (Labelling and Display) Regulations, 2020,
      reg. 5 — date marking: "best before" or "use by" as applicable to the
      food.

  - id: LG-FSSAI-01
    name: "FSSAI licence number is displayed"
    field: fssai_licence
    check:
      type: field_present
    citation: >-
      Food Safety and Standards (Licensing and Registration of Food
      Businesses) Regulations, 2011 — the FSSAI licence or registration number
      of the food business operator shall be displayed on the label.

# DEFERRED — LG-CAP-01 (text height, r. 9)
#
# Disabled for the first prototype, which targets a nitrogen-flushed chips
# pack. Two independent blockers:
#
#   1. No scale source. Measuring height in millimetres needs a known physical
#      reference in frame. The ArUco marker approach was removed as
#      impractical for a domed pillow pack, whose printed face is neither flat
#      nor coplanar with anything you could place beside it.
#   2. The Rule 9 threshold is unconfirmed, so the rule could only ever emit
#      NEEDS_REVIEW even with a scale.
#
# It is commented out rather than deleted because leaving it active would make
# every scan NOT_ASSESSABLE forever: that status outranks FAIL and PASS, so one
# permanently unmeasurable rule suppresses every other verdict the pipeline can
# legitimately reach.
#
# To restore: add a scale source, confirm the r. 9 table row for this SKU's net
# quantity and panel area, set needs_legal_confirmation to false, and uncomment.
#
#  - id: LG-CAP-01
#    field: mrp
#    check:
#      type: min_height_mm
#      params:
#        min_mm: 1.0
#        needs_legal_confirmation: true
#    citation: >-
#      Legal Metrology (Packaged Commodities) Rules, 2011, r. 9 — size of
#      letters and numerals in a declaration.

# -----------------------------------------------------------------------------
# Registry — the single in-scope SKU.
#
# UNPOPULATED. These are facts about one physical package and cannot be
# inferred from the statute or from code. Until they are filled in, every rule
# of type `matches_registry` returns NOT_ASSESSABLE("registry_unpopulated")
# rather than guessing — see rules/engine.py.
#
# Fill each field from the physical product, then set `populated: true`.
# -----------------------------------------------------------------------------
registry:
  populated: false

  sku_id: null

  # Every acceptable rendering of the brand as printed, including case and
  # spacing variants the OCR may return.
  brand_strings: []

  # Addresses by declared role. A role left null is treated as "not declared
  # for this SKU", which is different from "not found on the label".
  addresses:
    manufacturer: null
    packer: null
    importer: null
    marketer: null

  consumer_care:
    name: null
    address: null
    phone: null
    email: null

  # Exact printed MRP in rupees, e.g. 45.00
  mrp_exact: null

  # Exact printed net quantity, e.g. {value: 500, unit: g}
  net_quantity:
    value: null
    unit: null
